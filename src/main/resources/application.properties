spring.application.name=lksupply_db

spring.datasource.url=jdbc:mysql://localhost:3306/lksupply_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Secret (Keep this safe!)
app.jwtSecret=LkSupplyChainSecretKeyThatMustBeVeryLongAndSecureForProductionUse12345
app.jwtExpirationMs=86400000